name: Morning Briefing — 07:00 SAST Email

on:
  schedule:
    # 05:00 UTC = 07:00 SAST (runs before 06:00/11:00/16:00 publisher crons)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date YYYY-MM-DD (default today SAST)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: morning-briefing
  cancel-in-progress: false

env:
  BRIEFING_RELAY_URL: https://us-central1-happy-hunter-systems.cloudfunctions.net/queueMorningBrief

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Generate briefing
        id: gen
        run: |
          pip install requests >/dev/null 2>&1 || true
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/morning_briefing.py $DATE_ARG --write | tee /tmp/briefing.txt
          echo "BRIEF_DATE=$(date -d 'now +2 hours' +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "has_brief=true" >> $GITHUB_OUTPUT

      - name: Send email via Smart-Marketing relay (no Firebase key)
        id: send
        run: |
          python - <<'PY'
          import json, os, urllib.request
          date = "${{ steps.gen.outputs.BRIEF_DATE }}"
          base = "output/morning-brief-" + date
          html_p, md_p = base + ".html", base + ".md"
          html = open(html_p, encoding="utf-8").read() if os.path.exists(html_p) else ""
          text = open(md_p, encoding="utf-8").read() if os.path.exists(md_p) else open("/tmp/briefing.txt", encoding="utf-8").read()
          payload = json.dumps({
            "to": "motsumitl@happyhunterdigital.com",
            "subject": "Morning Briefing — " + date + " — Happy Hunter Digital",
            "html": html, "text": text,
          }).encode()
          req = urllib.request.Request(
            os.environ["BRIEFING_RELAY_URL"], data=payload,
            headers={"Content-Type": "application/json",
                      "x-briefing-secret": os.environ["BRIEFING_SECRET"]},
            method="POST")
          try:
            with urllib.request.urlopen(req, timeout=30) as r:
              print("Relay response:", r.status, r.read().decode()[:200])
          except Exception as e:
            print("Relay send failed (artifact still uploaded):", e)
            raise SystemExit(0)
          PY
        env:
          BRIEFING_SECRET: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Upload briefing artifact (always — email fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief-${{ steps.gen.outputs.BRIEF_DATE }}
          path: |
            output/morning-brief-*.md
            output/morning-brief-*.html
            /tmp/briefing.txt
          if-no-files-found: warn
          retention-days: 14
