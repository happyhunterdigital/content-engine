name: Morning Briefing — 07:00 SAST Email

on:
  schedule:
    # 05:00 UTC = 07:00 SAST (runs before 06:00/11:00/16:00 publisher crons)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date YYYY-MM-DD (default today SAST)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: morning-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Generate briefing
        id: gen
        run: |
          pip install requests >/dev/null 2>&1 || true
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/morning_briefing.py $DATE_ARG --write | tee /tmp/briefing.txt
          echo "BRIEF_DATE=$(date -d 'now +2 hours' +%Y-%m-%d)" >> $GITHUB_OUTPUT
          # Capture subject counts
          YEST=$(grep -c "Published" /tmp/briefing.txt || echo "0")
          echo "has_brief=true" >> $GITHUB_OUTPUT

      - name: Check Firebase secret
        id: check
        run: |
          if [ -z "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" ]; then
            echo "missing=true" >> $GITHUB_OUTPUT
            echo "::warning::FIREBASE_SERVICE_ACCOUNT not set — briefing generated but email skipped. Add it in repo Settings > Secrets > Actions."
          else
            echo "missing=false" >> $GITHUB_OUTPUT
          fi

      - name: Send email via Firestore Trigger Email
        if: steps.check.outputs.missing == 'false'
        run: |
          pip install firebase-admin >/dev/null 2>&1
          python scripts/send_firestore_email.py \
            --to "motsumitl@happyhunterdigital.com" \
            --subject "Morning Briefing — ${{ steps.gen.outputs.BRIEF_DATE }} — Happy Hunter Digital" \
            --html "output/morning-brief-${{ steps.gen.outputs.BRIEF_DATE }}.html" \
            --text "output/morning-brief-${{ steps.gen.outputs.BRIEF_DATE }}.md"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIRESTORE_PROJECT: happy-hunter-systems

      - name: Upload briefing artifact (always — email fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-brief-${{ steps.gen.outputs.BRIEF_DATE }}
          path: |
            output/morning-brief-*.md
            output/morning-brief-*.html
            /tmp/briefing.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Log briefing when Firebase secret missing
        if: steps.check.outputs.missing == 'true'
        run: |
          echo "=== BRIEFING (email not sent — missing FIREBASE_SERVICE_ACCOUNT) ==="
          cat /tmp/briefing.txt
          echo "=== To enable email: add FIREBASE_SERVICE_ACCOUNT in https://github.com/happyhunterdigital/content-engine/settings/secrets/actions ==="
          echo "=== Generate with: cat service-account.json | base64 -w 0 ==="
