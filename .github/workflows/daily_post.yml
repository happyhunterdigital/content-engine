name: Multi-Page Content Publisher

on:
  schedule:
    # Runs daily at 08:00 AM UTC
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger testing from GitHub UI

jobs:
  publish-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - brand: "Happy Hunter Digital"
            page_id_env: "FB_PAGE_ID_HAPPYHUNTER"
            token_env: "FB_TOKEN_HAPPYHUNTER"
            focus: "Digital Growth, Answer Engine Optimization (AEO), Local Search Visibility, Growth Strategy"
          - brand: "Ludo League SA"
            page_id_env: "FB_PAGE_ID_LUDOLEAGUE"
            token_env: "FB_TOKEN_LUDOLEAGUE"
            focus: "Competitive Gaming, Digital & Board Tournaments, Community Leaderboards, Event Hype"
          - brand: "Profuse Beauty"
            page_id_env: "FB_PAGE_ID_PROFUSE"
            token_env: "FB_TOKEN_PROFUSE"
            focus: "Cosmetics, Modern Skincare Routines, Beauty Tips, Product Highlights"

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install openai requests

      - name: Run Publisher for ${{ matrix.brand }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FB_PAGE_ID_HAPPYHUNTER: ${{ secrets.FB_PAGE_ID_HAPPYHUNTER }}
          FB_TOKEN_HAPPYHUNTER: ${{ secrets.FB_TOKEN_HAPPYHUNTER }}
          FB_PAGE_ID_LUDOLEAGUE: ${{ secrets.FB_PAGE_ID_LUDOLEAGUE }}
          FB_TOKEN_LUDOLEAGUE: ${{ secrets.FB_TOKEN_LUDOLEAGUE }}
          FB_PAGE_ID_PROFUSE: ${{ secrets.FB_PAGE_ID_PROFUSE }}
          FB_TOKEN_PROFUSE: ${{ secrets.FB_TOKEN_PROFUSE }}
        run: |
          python scripts/daily_post.py \
            --brand "${{ matrix.brand }}" \
            --page_id_env "${{ matrix.page_id_env }}" \
            --token_env "${{ matrix.token_env }}" \
            --focus "${{ matrix.focus }}"
