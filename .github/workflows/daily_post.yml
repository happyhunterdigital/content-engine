name: Multi-Brand Schedule Publisher

on:
  schedule:
    # Run at Morning (06:00 UTC = 08:00/08:30 SAST), Midday (11:00 UTC = 12:30/13:00 SAST), Evening (16:00 UTC = 18:00 SAST)
    - cron: '0 6,11,16 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD, e.g. 2026-08-03)'
        required: false
        default: ''
      slot:
        description: 'Time Slot (Morning, Midday, Evening, all)'
        required: false
        default: 'all'

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        brand: ["Happy Hunter Digital", "Integrated Wellth Solutions", "Ludo League SA"]
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v6

      - name: Setup Python Environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install requests openai

      - name: Run Schedule Publisher for ${{ matrix.brand }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FB_PAGE_ID_HAPPYHUNTER: ${{ secrets.FB_PAGE_ID_HAPPYHUNTER }}
          FB_TOKEN_HAPPYHUNTER: ${{ secrets.FB_TOKEN_HAPPYHUNTER }}
          FB_PAGE_ID_IWS: ${{ secrets.FB_PAGE_ID_IWS }}
          FB_TOKEN_IWS: ${{ secrets.FB_TOKEN_IWS }}
          FB_PAGE_ID_LUDOLEAGUE: ${{ secrets.FB_PAGE_ID_LUDOLEAGUE }}
          FB_TOKEN_LUDOLEAGUE: ${{ secrets.FB_TOKEN_LUDOLEAGUE }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_SLOT: ${{ github.event.inputs.slot }}
        run: |
          SLOT_ARG="${INPUT_SLOT:-all}"
          if [ -z "$INPUT_SLOT" ] || [ "$INPUT_SLOT" = "all" ]; then
            UTC_HOUR=$(date -u +%H)
            if [ "$UTC_HOUR" -eq 6 ]; then
              SLOT_ARG="Morning"
            elif [ "$UTC_HOUR" -eq 11 ]; then
              SLOT_ARG="Midday"
            elif [ "$UTC_HOUR" -eq 16 ]; then
              SLOT_ARG="Evening"
            else
              SLOT_ARG="all"
            fi
          fi

          ARGS=(
            --brand "${{ matrix.brand }}"
            --slot "$SLOT_ARG"
          )
          if [ -n "$INPUT_DATE" ]; then
            ARGS+=(--date "$INPUT_DATE")
          fi
          python scripts/publish_schedule.py "${ARGS[@]}"
