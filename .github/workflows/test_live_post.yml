name: Test Live Post - All Platforms
on: { workflow_dispatch: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.10' }
      - run: pip install requests requests-oauthlib
      - env:
          FB_PAGE_ID_HAPPYHUNTER: ${{ secrets.FB_PAGE_ID_HAPPYHUNTER }}
          FB_TOKEN_HAPPYHUNTER: ${{ secrets.FB_TOKEN_HAPPYHUNTER }}
          IG_USER_ID_HAPPYHUNTER: ${{ secrets.IG_USER_ID_HAPPYHUNTER }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python scripts/test_post_live.py
