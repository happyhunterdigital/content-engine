name: Check Posts
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: '3.10' }
      - run: pip install requests
      - env:
          FB_PAGE_ID_HAPPYHUNTER: ${{ secrets.FB_PAGE_ID_HAPPYHUNTER }}
          FB_TOKEN_HAPPYHUNTER: ${{ secrets.FB_TOKEN_HAPPYHUNTER }}
          IG_USER_ID_HAPPYHUNTER: ${{ secrets.IG_USER_ID_HAPPYHUNTER }}
          FB_PAGE_ID_IWS: ${{ secrets.FB_PAGE_ID_IWS }}
          FB_TOKEN_IWS: ${{ secrets.FB_TOKEN_IWS }}
        run: python scripts/check_posts.py
